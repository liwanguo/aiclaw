name: VPN Gate Node Check

# 私有仓库模式：检测结果上传为 Actions Artifact（nodes），不再发布 GitHub Pages。
# 定时更新：已启用【北京时间每天 00:00】。
# GitHub 的 cron 一律按 UTC 计算，北京时间 = UTC+8，故 00:00(北京) 对应 16:00(UTC)。
# 常用时间对照（改下面 cron 即可）：
#   每天 00:00（北京） ->  '0 16 * * *'
#   每天 08:00（北京） ->  '0 0 * * *'
#   每 6 小时          ->  '0 */6 * * *'
#   每 30 分钟         ->  '*/30 * * * *'
# 注意：GitHub 调度最小间隔约 5 分钟且通常延迟几分钟；仓库连续 60 天无提交会让定时任务自动停用，
#       届时手动运行一次或产生一次提交即可恢复。
on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      max_nodes:
        description: '最多检测多少个节点（0 = 全部）'
        required: false
        default: '0'
      concurrency:
        description: '并发数（建议 16–32）'
        required: false
        default: '32'
      timeout:
        description: '单节点检测超时（秒）'
        required: false
        default: '25'

permissions:
  contents: read

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    # 固定到 24.04：ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26，锁版本可避免届时突发破坏性变更。
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate worker secret
        id: domain
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          set -eu
          if [ -z "${DOMAIN}" ]; then
            echo "::error::未配置检测地址。请在仓库 Settings → Secrets and variables → Actions 中新增 Secret：DOMAIN（只填 Worker 的 host，例如 ai.aiclaw.de5.net）"
            exit 1
          fi

          # 与 vpngate.py 的 PLACEHOLDER_MARKERS 保持一致
          low=$(printf '%s' "${DOMAIN}" | tr '[:upper:]' '[:lower:]')
          case "${low}" in
            *你的*|*your_*|*your-*|*example.com*|*yourdomain*)
              echo "::error::DOMAIN 仍是占位符，请改成真实的 Worker host（例如 ai.aiclaw.de5.net）"
              exit 1
              ;;
          esac

          # 宽容解析：从任意粘贴形式中抽出 host，用户无需手改 Secret。
          # 支持：ai.aiclaw.de5.net / https://ai.aiclaw.de5.net
          #       https://ai.aiclaw.de5.net/check?sstp=vpn:vpn@
          #       以及 https//（少冒号）这类残缺写法
          raw=$(printf '%s' "${DOMAIN}" | tr -d '\r\n')
          raw=$(printf '%s' "${raw}" | sed -E 's|^[[:space:]]+||; s|[[:space:]]+$||')
          raw=$(printf '%s' "${raw}" | sed -E 's|^(https?)//|\1://|I')
          host=$(printf '%s' "${raw}" | sed -E 's|^[A-Za-z][A-Za-z0-9+.-]*://||; s|[/?#].*$||')
          host="${host%.}"

          if ! printf '%s' "${host}" | grep -Eq '^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?(:[0-9]{1,5})?$'; then
            echo "::error::无法从 DOMAIN 解析出合法 host（得到 ${host}）。请填 ai.aiclaw.de5.net 这种形式。"
            exit 1
          fi

          case "${host}" in
            *.*) ;;
            *)
              echo "::error::DOMAIN 不是完整域名：${host}（缺少点号，应形如 ai.aiclaw.de5.net）"
              exit 1
              ;;
          esac

          echo "host=${host}" >> "$GITHUB_OUTPUT"
          echo "检测域名已配置：${host}"

      - name: Run pipeline
        env:
          CHECK_WORKER: ${{ steps.domain.outputs.host }}
          CHECK_CONCURRENCY: ${{ github.event.inputs.concurrency || '32' }}
          CHECK_TIMEOUT: ${{ github.event.inputs.timeout || '25' }}
          MAX_CHECK_NODES: ${{ github.event.inputs.max_nodes || '0' }}
          MIN_SUCCESS_RATIO: '0'
        run: python vpngate.py

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodes
          path: public/
          retention-days: 30
          if-no-files-found: error

      - name: Show artifact info
        run: |
          echo "检测产物已上传为 Actions Artifact: nodes"
          echo "下载方式: 打开本次运行页面 -> Artifacts -> nodes.zip"
          echo "包含 public/nodes.txt, public/data.json, public/index.html"
